<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Cheat Sheet...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050b14;
      color: #e8f4f8;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    a { color: #00d4ff; }
  </style>
</head>
<body>
  <div>
    <p>Preparing your cheat sheet download...</p>
    <p>If download does not start, <a id="fallbackLink" href="frameworks-cheat-sheet-preview.pdf" download>tap here</a>.</p>
  </div>
  <script>
    (function () {
      const pdfUrl = 'frameworks-cheat-sheet-preview.pdf';
      const a = document.createElement('a');
      a.href = pdfUrl;
      a.setAttribute('download', 'frameworks-cheat-sheet-preview.pdf');
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => {
        window.location.href = pdfUrl;
      }, 900);
    })();
  </script>
</body>
</html>
