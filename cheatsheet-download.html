<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Cheat Sheet...</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #050b14;
      color: #e8f4f8;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    a { color: #00d4ff; }
  </style>
</head>
<body>
  <div>
    <p>Preparing your cheat sheet download...</p>
    <p>If download does not start, <a id="fallbackLink" href="#">tap here</a>.</p>
  </div>
  <script>
    function buildCheatsheetPdfBlob() {
      const lines = [
        'Cybersecurity Frameworks - Cheat Sheet',
        '',
        'The Three Pillars',
        '- Policy: Mandatory rules enforced by authority.',
        '- Guideline: Recommended best practices.',
        '- Standard: Specific measurable technical requirements.',
        '',
        'ISO 27001',
        '- International ISMS certification standard.',
        '- Best for organizations needing global recognition.',
        '',
        'NIST CSF 2.0',
        '- Flexible risk-based framework.',
        '- Functions: Identify, Protect, Detect, Respond, Recover.',
        '',
        'CIS Controls v8',
        '- 18 prioritized actionable controls.',
        '- IG1 is ideal for quick baseline improvements.',
        '',
        'Key Takeaways',
        '- Start: CIS Controls IG1',
        '- Scale: NIST CSF',
        '- Go global: ISO 27001'
      ];
      const content = lines.join('\n');
      const escaped = content.replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
      const stream = `BT
/F1 12 Tf
48 790 Td
14 TL
(${escaped.replace(/\n/g, ') Tj T* (')}) Tj
ET`;
      const objects = [
        `1 0 obj
<< /Type /Catalog /Pages 2 0 R >>
endobj`,
        `2 0 obj
<< /Type /Pages /Count 1 /Kids [3 0 R] >>
endobj`,
        `3 0 obj
<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >>
endobj`,
        `4 0 obj
<< /Length ${stream.length} >>
stream
${stream}
endstream
endobj`,
        `5 0 obj
<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>
endobj`
      ];

      let pdf = '%PDF-1.4\n';
      const offsets = [0];
      for (let i = 0; i < objects.length; i++) {
        offsets.push(pdf.length);
        pdf += objects[i] + '\n';
      }
      const xrefPos = pdf.length;
      pdf += `xref
0 ${objects.length + 1}
0000000000 65535 f 
`;
      for (let i = 1; i < offsets.length; i++) {
        pdf += `${String(offsets[i]).padStart(10, '0')} 00000 n 
`;
      }
      pdf += `trailer
<< /Size ${objects.length + 1} /Root 1 0 R >>
startxref
${xrefPos}
%%EOF`;
      return new Blob([pdf], { type: 'application/pdf' });
    }

    function triggerCheatsheetDownload() {
      const blob = buildCheatsheetPdfBlob();
      const url = URL.createObjectURL(blob);
      const filename = 'frameworks-cheat-sheet.pdf';
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 120000);
      return url;
    }

    (function () {
      const fallback = document.getElementById('fallbackLink');
      fallback.addEventListener('click', function (e) {
        e.preventDefault();
        triggerCheatsheetDownload();
      });
      triggerCheatsheetDownload();
    })();
  </script>
</body>
</html>
